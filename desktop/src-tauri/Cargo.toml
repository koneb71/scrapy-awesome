[package]
name = "scrapy-awesome-desktop"
version = "0.1.0"
description = "Desktop shell for scrapy-awesome (Tauri v2 + Python sidecar)"
edition = "2021"
rust-version = "1.77"

[lib]
name = "scrapy_awesome_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
